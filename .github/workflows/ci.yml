# 每次 push / PR 的完整 CI。
#
# package.json 的 test（连同 npm 自动执行的前后置生命周期）仍是唯一测试清单。
# 这里只在运行时把这份清单递归展开为隔离组；workflow 不保存第二份套件列表。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24.22.1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 先验证“分组并集 == package.json 的完整测试链”。该 job 的 groups
  # output 是下面 matrix 的唯一来源；新增测试默认归入 core，不能静默漏跑。
  test-plan:
    name: Validate complete test plan
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      groups: ${{ steps.plan.outputs.groups }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Validate canonical test chain and emit matrix
        id: plan
        shell: pwsh
        run: node scripts/run-test-group.mjs --validate --github-output "$env:GITHUB_OUTPUT"

  # 五个独立 runner 并行。组内仍按 package.json 中的原始顺序串行执行；
  # Native 文件身份、句柄和权限用例不共享 runner 或可变目标。
  test:
    name: Tests (${{ matrix.group }})
    needs: test-plan
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        group: ${{ fromJSON(needs.test-plan.outputs.groups) }}
    env:
      TEST_GROUP: ${{ matrix.group }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Compatibility tests execute published historical code.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare isolated test directories
        shell: pwsh
        run: |
          # Keep Native fixtures in the standard profile TEMP used by baseline.
          # The D:-based run failed SACL setup; the C: reference path passes it.
          $tempBase = Join-Path $env:USERPROFILE 'AppData\Local\Temp'
          $temp = Join-Path $tempBase "pi-gui-ci-$env:TEST_GROUP"
          $resultsRoot = Join-Path $env:RUNNER_TEMP "pi-gui-ci-$env:TEST_GROUP"
          $results = Join-Path $resultsRoot 'results'
          New-Item -ItemType Directory -Force -Path $temp, $results | Out-Null
          "TEMP=$temp" >> $env:GITHUB_ENV
          "TMP=$temp" >> $env:GITHUB_ENV
          "TMPDIR=$temp" >> $env:GITHUB_ENV
          "PI_GUI_CI_TEMP=$temp" >> $env:GITHUB_ENV
          "PI_GUI_CI_RESULTS=$results" >> $env:GITHUB_ENV

      - name: Run canonical test group
        shell: pwsh
        run: |
          node scripts/run-test-group.mjs --group "$env:TEST_GROUP" `
            --results "$env:PI_GUI_CI_RESULTS\results.json"

      - name: Upload group timing and status
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.group }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/pi-gui-ci-${{ matrix.group }}/results

  # 任何测试组失败时，该 job 因 needs: test 而被跳过，不会浪费打包时间。
  build-check:
    name: Electron build check
    needs: test
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate test fixtures
        run: npm run fixtures
        env:
          PI_GUI_SKIP_LIBREOFFICE: '1'

      # 这一步同时走 Electron 组装与 Node SEA / 单文件注入两条打包链路。
      - name: Build Electron app
        run: npm run build:app -- --rebuild

      - name: Verify packaged app
        run: npm run test:app

      - name: Verify single-file exe
        run: npm run test:exe

  # 唯一汇总门。矩阵里任一格失败，或依赖未执行 / 被取消 / 跳过，均不得显示成功。
  ci-gate:
    name: CI gate
    needs: [test-plan, test, build-check]
    if: ${{ always() }}
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Require every upstream job to succeed
        shell: pwsh
        env:
          PLAN_RESULT: ${{ needs.test-plan.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build-check.result }}
        run: |
          $checks = [ordered]@{
            'test-plan' = $env:PLAN_RESULT
            'test-matrix' = $env:TEST_RESULT
            'build-check' = $env:BUILD_RESULT
          }
          $failed = @()
          foreach ($entry in $checks.GetEnumerator()) {
            Write-Host "$($entry.Key): $($entry.Value)"
            if ($entry.Value -ne 'success') { $failed += "$($entry.Key)=$($entry.Value)" }
          }
          if ($failed.Count -gt 0) {
            throw "CI incomplete or failed: $($failed -join ', ')"
          }
