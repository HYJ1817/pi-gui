name: CI
run-name: D2 strict SACL witness for 672b3ed
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d2-sacl-672b3ed
  cancel-in-progress: false
jobs:
  sacl-witness:
    name: New helper strict SACL witness
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@v5
        with:
          ref: 672b3edbaf6aab2b81d1a34e9bf223d2e518e312
      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify commit and tested helper bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim()
          if ($head -cne '672b3edbaf6aab2b81d1a34e9bf223d2e518e312') { throw 'source_commit_mismatch' }
          $helperHash = (Get-FileHash server/session-revert-object-write-native.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($helperHash -cne '7d773b63777d97a6a78d9a81c37cf946929062b22028425889258becd3aa39ef') { throw 'helper_hash_mismatch' }
          Write-Output "sourceCommit=$head helperHash=$helperHash"
          node --version
          whoami /priv
      - name: Run strict witness within already assigned audit privilege
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # This disposable CI token must ALREADY possess SeSecurityPrivilege.
          # Activate that assigned bit only; no UAC, policy or account changes.
          Add-Type -TypeDefinition @'
          using System;
          using System.Diagnostics;
          using System.Runtime.InteropServices;
          public static class D2AuditToken {
            [StructLayout(LayoutKind.Sequential)] struct Luid { public uint Low; public int High; }
            [StructLayout(LayoutKind.Sequential)] struct Privilege { public uint Count; public Luid Id; public uint Attributes; }
            [DllImport("advapi32.dll",SetLastError=true)] static extern bool OpenProcessToken(IntPtr process,uint access,out IntPtr token);
            [DllImport("advapi32.dll",CharSet=CharSet.Unicode,SetLastError=true)] static extern bool LookupPrivilegeValue(string system,string name,out Luid id);
            [DllImport("advapi32.dll",SetLastError=true)] static extern bool AdjustTokenPrivileges(IntPtr token,bool disable,ref Privilege state,uint length,IntPtr previous,IntPtr returned);
            [DllImport("kernel32.dll")] static extern bool CloseHandle(IntPtr token);
            public static bool ActivateAssigned() {
              IntPtr token;
              if(!OpenProcessToken(Process.GetCurrentProcess().Handle,0x28,out token)) return false;
              try {
                Luid id;
                if(!LookupPrivilegeValue(null,"SeSecurityPrivilege",out id)) return false;
                var state=new Privilege { Count=1, Id=id, Attributes=2 };
                return AdjustTokenPrivileges(token,false,ref state,0,IntPtr.Zero,IntPtr.Zero) && Marshal.GetLastWin32Error()==0;
              } finally { CloseHandle(token); }
            }
          }
          '@
          if (![D2AuditToken]::ActivateAssigned()) { throw 'existing_ci_audit_privilege_unavailable' }
          # Node and the unchanged native helper inherit this test token.
          node tests/session-revert-object-witness.cjs --require-audit 2>&1 | Tee-Object -FilePath d2-sacl-witness.log
          $auditExit = $LASTEXITCODE
          if ($auditExit -ne 0) { exit $auditExit }
          $rows = Get-Content d2-sacl-witness.log
          $result = $rows | Where-Object { $_.StartsWith('{') } | Select-Object -First 1 | ConvertFrom-Json
          if ($result.passed -ne 8 -or $result.failed -ne 0 -or $result.skipped -ne 0 -or $result.helperHash -cne '7d773b63777d97a6a78d9a81c37cf946929062b22028425889258becd3aa39ef') { throw 'strict_witness_not_qualified' }
      - name: Save qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d2-sacl-witness-672b3ed
          path: d2-sacl-witness.log
          if-no-files-found: warn
