# 正式发布：**只由 tag 触发**。
#
#   git tag v0.13.0 && git push origin v0.13.0
#
# ---------- 为什么不挂 push main ----------
#
# 「每次合并到 main 就自动发版」是不可接受的：版本号必须由人决定，而 main 上
# 的提交大多不是发版。见 docs/releasing.md 的「版本号必须在 tag 之前进仓库」——
# 这个 workflow **不会**根据 tag 去改 package.json。tag 只是证明
# 「这个 commit 就是 0.13.0」，它必须已经在代码里声明过了。
#
# ---------- 这个 workflow 刻意很薄 ----------
#
# 它只做三件事：装环境、调 `npm run release:check`、调 `scripts/publish-release.mjs`。
# **业务逻辑都在 scripts/ 里**，因为：① 本机能跑同一套，所以本机绿 ≈ CI 绿；
# ② 脚本能被单元测试覆盖，而 YAML 不能。
#
# ---------- 失败不留半成品 ----------
#
# 顺序刻意是「**全部验证通过之后**才碰 GitHub」：
#   tag/精确 SHA 证明 → main CI 与最终 gate → 构建 → 产物守卫
#   → 创建 draft → 上传 → 核对 → 发布
# 所以任何一个验证步骤失败时，**根本还没有 Release**。
#
# 精确 SHA 的 main push CI 已完成且 ci-gate 成功后，Release 才跳过重复的
# npm test。CI 未完成、失败、找不到同一 SHA 的运行，或 tag/checkout/运行
# 身份不一致，都会在碰 GitHub Release 之前失败。
#
# 真正需要 draft 的只有「上传」这一段：上传可能中途失败，而 GitHub 没有事务。
# 用 draft 兜住它：draft 对用户不可见，上传 + 核对全过了才 publish。
# 核对用的是 GitHub 自己算的 sha256（见 scripts/verify-uploaded-release.mjs），
# 所以「传上去的字节 == 本地验证过的字节」是验过的，不是假设的。
#
# 重复执行：tag 上已经有**已发布**的 Release → 直接失败，绝不覆盖已发布的二进制。
# 只剩一个 draft → 复用它（那是上一次失败的残留，draft 对用户不可见）。
# 这个判断与后面的上传/核对/发布一起在 scripts/publish-release.mjs 里，有单元测试。
#
# ---------- 权限 ----------
#
# 验证 / 打包和创建 Release 分成两个 job：构建脚本只能拿到只读权限；
# 只有不执行 npm 生命周期的发布 job 才拿到 contents: write。
# 两个 job 的 actions: read 只用于读取 CI 证明和传递同一次运行的已验证 artifact。
# 用内置的 GITHUB_TOKEN，**不用个人 PAT** —— PAT 会绕过分支保护、无法随仓库
# 转移、也容易过期。
#
# action 版本与 ci.yml 保持一致（都钉 v5，理由见 ci.yml 头部备注）。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  NODE_VERSION: '24.14.0'

concurrency:
  group: release-${{ github.ref }}
  # 发版不能中途取消 —— 取消一个正在上传的 Release 只会留下更难收拾的状态。
  cancel-in-progress: false

jobs:
  verify:
    name: Prove CI, build and verify release
    permissions:
      contents: read
      actions: read
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Source tests are reused from exact-SHA CI; packaging only needs the tag commit.
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # NSIS 不在 windows-latest 的预装清单里，而 build:installer 需要 makensis。
      # 装完之后 scripts/build-installer.mjs 的 findMakensis() 会在
      # `C:\Program Files (x86)\NSIS\makensis.exe` 找到它（它本来就列了这个候选）。
      - name: Install NSIS
        run: choco install nsis --no-progress -y

      # ---------------------------------------------------------------- 预检
      #
      # **一条命令**跑完「打 tag 之前该做的事」，本机与 CI 跑的是同一套：
      #   版本一致性（含 tag 必须等于 v<package.json 的 version>）
      #   → 远端 tag 解析出的 commit 必须等于 checkout 的 HEAD
      #   → 该 SHA 的 main push CI 已完成且 ci-gate 成功
      #   → 通过后才跳过已经验证过的 npm test
      #   → build:app / build:installer --zip
      #   → test:app / test:exe / test:portable / test:installer
      #   → 集中到 dist-release/ + 产物守卫 + 独立复算 SHA256
      #
      # --with-installer 是必须的：安装程序是「构建成功但一跑就废」的重灾区，
      # 只有真装一遍才验得出来。runner 是一次性虚拟机，装完即弃。
      #
      # 版本一致性在这里**带 tag 校验**：tag 与 package.json 不一致就直接失败，
      # 绝不「猜一个版本然后继续」。
      - name: Release precheck (exact-SHA CI proof, build, artifact guards)
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $exactSha = (git rev-parse HEAD).Trim()
          npm run release:check -- --tag="$env:RELEASE_TAG" --ci-sha="$exactSha" --with-installer

      # 已通过守卫的资产在同一 workflow 内传给发布 job；关闭重复压缩，
      # 因为两个正式二进制本身已经是压缩格式。
      - name: Upload verified release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist-release
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # ------------------------------------------------- 创建/上传/核对/发布
  publish:
    name: Publish verified release
    needs: verify
    permissions:
      contents: write
      actions: read
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release summary
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download verified release assets
        uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist-release

      - name: Re-check exact-SHA CI proof before draft
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $exactSha = (git rev-parse HEAD).Trim()
          node scripts/verify-ci-proof.mjs --tag="$env:RELEASE_TAG" --sha="$exactSha" --expected-sha="$env:EXPECTED_SHA" --repo="$env:GITHUB_REPOSITORY"

      # artifact 跨 job 传输后再验一次：文件名、数量、魔数、版本和 SHA256
      # 都必须与发布前一致，然后才允许碰 GitHub Release。
      - name: Re-verify downloaded release assets
        run: npm run release:verify

      # ------------------------------------------------- 创建/上传/核对/发布
      #
      # **全部逻辑在 scripts/publish-release.mjs 里**（可被单元测试覆盖），
      # 这里只留一行调用。为什么挪出去：
      #   这段真正容易错的是**分支**，不是命令本身 ——
      #   「已发布必须拒绝 / 只剩 draft 才复用 / 核对不过绝不 publish / publish 排最后」。
      #   写在 YAML 里就只能靠真的打一个 tag 去试，而那会真的产生一个 Release；
      #   挪进脚本之后，注入一个假 gh 就能把分支表全测一遍
      #   （见 tests/release-artifacts.cjs 的「发布编排」一节）。
      #
      # 脚本会：判断状态（没有→创建 draft / 只剩 draft→复用 / 已发布→**直接失败**）
      # → 上传 dist-release/* → 拿 GitHub 自己算的 sha256 与本机逐项核对
      # → 追加交付物说明 → **最后**才 --draft=false → 再确认一次已发布。
      #
      # 核对不过就抛错，此时还只是 draft，用户完全不知道它存在过。
      - name: Publish release (draft → upload → verify → publish)
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs --tag="$env:RELEASE_TAG" --expected-sha="$env:EXPECTED_SHA"
