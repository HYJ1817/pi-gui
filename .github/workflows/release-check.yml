# 发布前验证：**手动触发**，不挂在 push / PR 上。
#
# 为什么单独一个 workflow：这里的每一步都比 ci.yml 贵一个量级 ——
# 完整打包要几分钟、安装程序要 NSIS 与 ~430MB 产物、还要真的把应用装一遍
# 再卸一遍。把它们塞进每次 push 只会让 CI 变慢变脆，而它们真正需要被验证的
# 时机是「准备发版」，不是「改了一行代码」。
#
# ---------- 与 release.yml / ci.yml 的分工 ----------
#
#   ci.yml            每次 push / PR：npm test + build:app + test:app + test:exe
#   release-check.yml **本文件**：不创建 Release，只把完整发布路径跑一遍
#                     （含安装程序 / 便携版 / 产物守卫 / 校验和）
#   release.yml       tag 触发：先核对精确 SHA 已通过 CI，再跑构建 / 安装 /
#                     产物验证，通过之后才创建并发布 Release
#
# 三者调用的是**同一套 npm 脚本**（npm test / build:app / build:installer /
# test:* / release:collect / release:verify），没有各自手写一份构建逻辑。
# release.yml 直接调 `npm run release:check`，但传入精确 SHA，验证该提交的
# 完整 CI 与最终 gate 后跳过重复的 npm test；本文件始终保留完整 npm test，
# 适合准备发版时手动做一次与 CI 历史无关的完整检查。
#
# 为什么**不**挂 pull_request：完整跑一次要 45-60 分钟（真装真卸 + 打 430MB 产物），
# 挂在每个 PR 上会让贡献者等到放弃。而 PR 需要的版本一致性守卫已经在
# `npm test` 里（tests/version-consistency.cjs 与 tests/release-artifacts.cjs），
# ci.yml 每次 push/PR 都会跑 —— 所以「改了版本号忘了同步 lock」「资产命名漂了」
# 这类问题在 PR 阶段就能被拦住，不需要等这个 workflow。
#
# action 版本与 ci.yml 保持一致（都钉 v5，理由见 ci.yml 头部备注）。
name: Release check

on:
  workflow_dispatch:
    inputs:
      installer:
        description: '同时验证安装程序与便携版（需要装 NSIS，约多花 15 分钟）'
        type: boolean
        default: true

permissions:
  contents: read

env:
  NODE_VERSION: '24.22.1'

concurrency:
  group: release-check-${{ github.ref }}
  # 发版验证不做「取消旧的」—— 它本来就可能跑十几分钟，
  # 中途被取消反而要重来一遍。
  cancel-in-progress: false

jobs:
  # ------------------------------------------------ 测试 + 两条打包链路
  verify:
    name: Tests and packaging
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # npm test verifies compatibility against published historical code.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run core tests
        run: npm test

      # test:app / test:exe 需要 PDF 固件（见 ci.yml 里同一处的说明）。
      - name: Generate test fixtures
        run: npm run fixtures
        env:
          PI_GUI_SKIP_LIBREOFFICE: '1'

      - name: Build Electron app
        run: npm run build:app -- --rebuild

      - name: Verify packaged app
        run: npm run test:app

      - name: Verify single-file exe
        run: npm run test:exe

  # ------------------------------------------------- 安装程序 / 便携版
  installer:
    name: Installer and portable
    needs: verify
    if: ${{ inputs.installer }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Official fixed-version installer; SHA256 is pinned and verified before execution.
      # Bounded retries and a compiler version probe fail before any build on error.
      - name: Install verified NSIS
        run: node scripts/install-ci-nsis.mjs

      - name: Build Electron app
        run: npm run build:app -- --rebuild

      # 安装程序与便携版都从 dist-installer/ 读产物，文件名带 package.json
      # 里的版本号，所以必须排在 build:app 之后。
      - name: Build installer and portable zip
        run: npm run build:installer -- --zip

      # 把正式资产集中到 dist-release/ 并跑发布守卫 —— 与 release.yml 里
      # `npm run release:check` 最后两步完全同一套脚本。
      # 目的：在这里就能发现「资产命名漂了 / 校验和与文件对不上 / 混进了
      # 调试文件 / 版本号对不上」，而不是等 tag 推上去之后。
      - name: Collect release artifacts
        run: npm run release:collect

      - name: Verify release artifacts
        run: npm run release:verify

      - name: Verify portable zip
        run: npm run test:portable

      - name: Verify installer
        run: npm run test:installer
        # 这一步会真的安装（写 %LOCALAPPDATA%）、建快捷方式、启动一次、
        # 再从「添加或删除程序」卸掉。runner 是一次性虚拟机，测完即弃。
        # 注意：本机开发环境里 reg.exe 被安全策略拉黑，有 5 条注册表断言
        # 会被跳过；GitHub runner 上没有这个限制，应该 20 条全部执行。
