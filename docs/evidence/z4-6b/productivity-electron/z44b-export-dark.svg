<svg xmlns="http://www.w3.org/2000/svg" width="17452" height="11960" viewBox="0 0 17452 11960" role="img" aria-label="流程图导出：3 个节点">
  <title>流程图</title>
  <rect x="0" y="0" width="17452" height="11960" fill="#151515" />
  <defs>
    <marker id="export-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" fill="#c3c2b7">
      <path d="M 0 0 L 10 5 L 0 10 z" />
    </marker>
  </defs>
  <g stroke="#c3c2b7" stroke-width="1.5" fill="none">
    <g>
      <line x1="17265.81" y1="112" x2="9486.19" y2="4248" marker-end="url(#export-arrow)" />
      <title>n1 → n2</title>
    </g>
    <g>
      <line x1="9386.84" y1="4312" x2="165.16" y2="11848" marker-end="url(#export-arrow)" />
      <title>n2 → n3</title>
    </g>
  </g>
  <g font-family="system-ui, &#39;Segoe UI&#39;, &#39;Microsoft YaHei&#39;, &#39;PingFang SC&#39;, sans-serif">
    <g>
      <rect x="17248" y="48" width="156" height="64" rx="7" fill="#1a1a19" stroke="#7b7971" stroke-width="1.5" />
      <title>开始</title>
      <text x="17326" y="74" text-anchor="middle" font-size="12" fill="#f0efec" stroke="none">
        <tspan x="17326" dy="0">开始</tspan>
      </text>
    </g>
    <g>
      <rect x="9348" y="4248" width="156" height="64" rx="7" fill="#1a1a19" stroke="#7b7971" stroke-width="1.5" />
      <title>处理</title>
      <text x="9426" y="4274" text-anchor="middle" font-size="12" fill="#f0efec" stroke="none">
        <tspan x="9426" dy="0">处理</tspan>
      </text>
    </g>
    <g>
      <rect x="48" y="11848" width="156" height="64" rx="7" fill="#1a1a19" stroke="#7b7971" stroke-width="1.5" />
      <title>结束</title>
      <text x="126" y="11874" text-anchor="middle" font-size="12" fill="#f0efec" stroke="none">
        <tspan x="126" dy="0">结束</tspan>
      </text>
    </g>
  </g>
</svg>