<!-- @dsCard group="Feedback" height=330 subtitle="原生可交互预览 · 演示数据" -->
<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Toast · Pi Workbench</title></head><body class="pw-preview">
<div class="pw-state-controls"><label for="stateSwitch">模拟组件状态</label><select id="stateSwitch" class="pw-select" aria-label="模拟组件状态"><option value="default">default</option><option value="hover">hover</option><option value="pressed">pressed</option><option value="selected">selected</option><option value="focus">focus</option><option value="disabled">disabled</option><option value="error">error</option></select><span>演示组件 · 不连接应用</span></div>
<button id="example" class="pw-button">显示演示通知</button><div id="demoToast" class="pw-toast" role="status" aria-live="polite" hidden style="margin-top:16px"><span class="pw-grow">演示：会话标题已保存</span><button id="dismissToast" class="pw-icon-button" aria-label="关闭通知"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
<output id="result" class="pw-result" aria-live="polite">可操作预览。真实应用行为以功能映射与后续验收为准。</output>
<script>
(()=>{
const example=document.getElementById('example'),result=document.getElementById('result'),stateSwitch=document.getElementById('stateSwitch');
stateSwitch.addEventListener('change',()=>{const state=stateSwitch.value;example.dataset.state=state;if('disabled' in example)example.disabled=state==='disabled';if(state==='focus'&&typeof example.focus==='function')example.focus();if(['INPUT','TEXTAREA','SELECT'].includes(example.tagName))example.setAttribute('aria-invalid',String(state==='error'));result.textContent='模拟 '+state+'；复合组件状态作用于可交互子项，具体语义见组件规范。';});
let toastTimer;const toast=document.getElementById('demoToast');example.addEventListener('click',()=>{clearTimeout(toastTimer);toast.hidden=false;result.textContent='演示：同类通知替换，不堆叠。';toastTimer=setTimeout(()=>toast.hidden=true,5000);});document.getElementById('dismissToast').addEventListener('click',()=>{clearTimeout(toastTimer);toast.hidden=true;example.focus();});toast.addEventListener('pointerenter',()=>clearTimeout(toastTimer));toast.addEventListener('focusin',()=>clearTimeout(toastTimer));

})();
</script>
</body></html>
