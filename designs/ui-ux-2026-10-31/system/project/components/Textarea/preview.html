<!-- @dsCard group="Inputs" height=430 subtitle="原生可交互预览 · 演示数据" -->
<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Textarea · Pi Workbench</title></head><body class="pw-preview">
<div class="pw-state-controls"><label for="stateSwitch">模拟组件状态</label><select id="stateSwitch" class="pw-select" aria-label="模拟组件状态"><option value="default">default</option><option value="hover">hover</option><option value="pressed">pressed</option><option value="selected">selected</option><option value="focus">focus</option><option value="disabled">disabled</option><option value="error">error</option></select><span>演示组件 · 不连接应用</span></div>
<div class="pw-field"><label for="example">发送给 Agent</label><textarea id="example" class="pw-textarea" rows="3" maxlength="2000" aria-describedby="textareaHelp">请核对侧栏切换时的草稿恢复规则。</textarea><span id="textareaHelp" class="pw-help">Shift+Enter 换行；原型不调用模型。</span></div>
<output id="result" class="pw-result" aria-live="polite">可操作预览。真实应用行为以功能映射与后续验收为准。</output>
<script>
(()=>{
const example=document.getElementById('example'),result=document.getElementById('result'),stateSwitch=document.getElementById('stateSwitch');
stateSwitch.addEventListener('change',()=>{const state=stateSwitch.value;example.dataset.state=state;if('disabled' in example)example.disabled=state==='disabled';if(state==='focus'&&typeof example.focus==='function')example.focus();if(['INPUT','TEXTAREA','SELECT'].includes(example.tagName))example.setAttribute('aria-invalid',String(state==='error'));result.textContent='模拟 '+state+'；复合组件状态作用于可交互子项，具体语义见组件规范。';});
example.addEventListener('input',()=>{example.style.height='auto';example.style.height=Math.min(240,example.scrollHeight)+'px';result.textContent='演示：'+example.value.length+' / 2000 字符，草稿仅存在当前预览。';});

})();
</script>
</body></html>
