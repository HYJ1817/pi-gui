<!-- @dsCard group="Overlays" height=430 subtitle="原生可交互预览 · 演示数据" -->
<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Menu · Pi Workbench</title></head><body class="pw-preview">
<div class="pw-state-controls"><label for="stateSwitch">模拟组件状态</label><select id="stateSwitch" class="pw-select" aria-label="模拟组件状态"><option value="default">default</option><option value="hover">hover</option><option value="pressed">pressed</option><option value="selected">selected</option><option value="focus">focus</option><option value="disabled">disabled</option><option value="error">error</option></select><span>演示组件 · 不连接应用</span></div>
<div class="pw-row"><button id="example" class="pw-button" aria-haspopup="menu" aria-expanded="false" aria-controls="demoMenu">会话操作</button><span id="contextTarget" tabindex="0" class="pw-secondary">也可在此右键或按 Shift+F10</span></div><div id="demoMenu" role="menu" class="pw-menu" hidden style="position:fixed;z-index:100"><button role="menuitem" class="pw-menu-item">重命名<span class="pw-shortcut">F2</span></button><button role="menuitem" class="pw-menu-item">导出对话</button><button role="menuitem" class="pw-menu-item" disabled>删除运行中的会话</button></div>
<output id="result" class="pw-result" aria-live="polite">可操作预览。真实应用行为以功能映射与后续验收为准。</output>
<script>
(()=>{
const example=document.getElementById('example'),result=document.getElementById('result'),stateSwitch=document.getElementById('stateSwitch');
stateSwitch.addEventListener('change',()=>{const state=stateSwitch.value;example.dataset.state=state;if('disabled' in example)example.disabled=state==='disabled';if(state==='focus'&&typeof example.focus==='function')example.focus();if(['INPUT','TEXTAREA','SELECT'].includes(example.tagName))example.setAttribute('aria-invalid',String(state==='error'));result.textContent='模拟 '+state+'；复合组件状态作用于可交互子项，具体语义见组件规范。';});
const menu=document.getElementById('demoMenu'),target=document.getElementById('contextTarget');function close(){menu.hidden=true;example.setAttribute('aria-expanded','false');example.focus();}function open(x,y){menu.hidden=false;const r=menu.getBoundingClientRect();menu.style.left=Math.max(8,Math.min(x,innerWidth-r.width-8))+'px';menu.style.top=Math.max(8,Math.min(y,innerHeight-r.height-8))+'px';example.setAttribute('aria-expanded','true');menu.querySelector('button:not(:disabled)').focus();}example.addEventListener('click',()=>{if(!menu.hidden){close();return;}const r=example.getBoundingClientRect();open(r.left,r.bottom+8);});target.addEventListener('contextmenu',e=>{e.preventDefault();open(e.clientX,e.clientY);});target.addEventListener('keydown',e=>{if(e.key==='F10'&&e.shiftKey){e.preventDefault();const r=target.getBoundingClientRect();open(r.left,r.bottom);}});menu.addEventListener('click',e=>{if(e.target.closest('button')&&!e.target.closest('button').disabled){result.textContent='演示：'+e.target.closest('button').textContent;close();}});document.addEventListener('keydown',e=>{if(menu.hidden)return;if(e.key==='Escape'){e.preventDefault();close();}if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();const a=[...menu.querySelectorAll('button:not(:disabled)')],n=a.indexOf(document.activeElement),i=e.key==='Home'?0:e.key==='End'?a.length-1:(n+(e.key==='ArrowDown'?1:-1)+a.length)%a.length;a[i].focus();}});document.addEventListener('pointerdown',e=>{if(!menu.hidden&&!menu.contains(e.target)&&e.target!==example)close();});

})();
</script>
</body></html>
