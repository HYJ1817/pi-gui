<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pi GUI</title>
<script src="/theme-init.js"></script>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/ui/primitives.css">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/mcp.css">
<link rel="stylesheet" href="/thinking-dots.css">
<link rel="stylesheet" href="/agent-execution.css">
<link rel="stylesheet" href="/app-shell.css">
<link rel="stylesheet" href="/runtime-conversation.css">
<link rel="stylesheet" href="/ui3-composer.css">
<link rel="stylesheet" href="/ui3-model.css">
<link id="ui3-inline-commands-style" data-ui3-inline-commands rel="stylesheet" href="/ui3-inline-commands.css">
<link rel="stylesheet" href="/process.css">
<link rel="stylesheet" href="/vendor/xterm/xterm.css">
<link id="ui4-pane-style" rel="stylesheet" href="/ui4-pane.css">
<link id="specs-style" rel="stylesheet" href="/specs.css">
<link id="ui4-approval-style" data-ui4-approval rel="stylesheet" href="/ui4-approval.css">
<link id="ui4-feedback-style" data-ui4-feedback rel="stylesheet" href="/ui4-feedback.css">
<link id="ui5-logs-style" data-ui5-logs rel="stylesheet" href="/ui5-logs.css">
<link id="viz-style" rel="stylesheet" href="/viz.css">
<link rel="stylesheet" href="/collab.css">
<link rel="stylesheet" href="/collab-panel.css">
<link rel="stylesheet" href="/collab-productivity.css">
<link rel="stylesheet" href="/provider-management.css">
</head>
<body>

<div class="app">

  <nav class="global-rail" id="globalRail" aria-label="折叠的侧栏" hidden>
    <button type="button" class="rail-icon" id="btnSidebarExpand" aria-label="展开项目侧栏" aria-controls="projectSidebar" aria-expanded="true" title="展开项目侧栏"><svg data-icon="sidebarExpand" aria-hidden="true" focusable="false"></svg></button>
  </nav>

  <aside class="rail project-sidebar" id="projectSidebar" aria-label="项目与会话">
    <header class="rail-head">
      <div class="brand"><span class="brand-mark">π</span><span>pi-GUI</span></div>
      <button type="button" class="icon-btn" id="btnSidebarCollapse" aria-label="折叠项目侧栏" aria-controls="projectSidebar" aria-expanded="true" title="折叠项目侧栏"><svg data-icon="sidebarCollapse" aria-hidden="true" focusable="false"></svg></button>
    </header>
    <button type="button" class="settings-return nav-item" id="settingsReturn" hidden><svg class="return-ic" data-icon="chevronLeft" aria-hidden="true" focusable="false"></svg><span>返回应用</span></button>
    <nav class="rail-nav" aria-label="会话操作">
      <div class="sidebar-session-heading">
        <button type="button" class="nav-item rail-icon is-active" id="navHome" aria-label="对话" aria-current="page" title="对话"><span class="ni-label">会话</span></button>
        <button type="button" class="icon-btn" id="navSearch" aria-label="搜索会话" title="搜索会话" aria-controls="groupBody" aria-expanded="false"><svg data-icon="search" aria-hidden="true" focusable="false"></svg></button>
      </div>
      <button type="button" class="nav-item" id="navNew"><svg class="ni-ic" data-icon="conversation" aria-hidden="true" focusable="false"></svg><span class="ni-label">新对话</span><svg class="ni-add-ic" data-icon="plus" aria-hidden="true" focusable="false"></svg></button>
    </nav>
    <div class="rail-group open">
      <div class="group-bar"><button type="button" class="group-head" id="groupHead" aria-controls="groupBody" aria-expanded="true"><span>项目</span><svg class="chev" data-icon="chevronRight" aria-hidden="true" focusable="false"></svg></button><button type="button" class="icon-btn project-actions-toggle" id="btnProjectMenu" aria-label="项目操作" aria-controls="projectActions" aria-expanded="false" title="项目操作"><svg data-icon="more" aria-hidden="true" focusable="false"></svg></button></div>
      <div class="project-actions" id="projectActions" hidden>
        <button type="button" class="group-add" id="btnAddProject">添加文件夹</button>
        <button type="button" class="group-add" id="btnProjectSettings">项目设置</button>
      </div>
      <div class="group-body" id="groupBody"><div class="projects" id="projects"><div class="hint-empty">加载中…</div></div></div>
    </div>
    <nav class="global-more-menu settings-menu" id="globalMoreMenu" hidden aria-label="设置">
      <div class="settings-search-bar ds-search-field ds-search-control" id="settingsSearchBar">
        <svg class="search-ic" data-icon="search" aria-hidden="true" focusable="false"></svg>
        <input type="text" class="settings-search-input" id="settingsSearchInput" placeholder="搜索设置..." aria-label="搜索设置">
      </div>
      <section role="group" aria-labelledby="settingsAppearance"><h3 id="settingsAppearance">常规与界面</h3>
        <button type="button" id="navAppearance"><svg data-icon="sliders" aria-hidden="true" focusable="false"></svg><span>常规</span></button>
        <button type="button" id="navShortcutHelp" title="查看键盘快捷键"><svg data-icon="keyboard" aria-hidden="true" focusable="false"></svg><span>快捷键</span></button>
        <button type="button" id="navPalette" title="打开命令面板"><svg data-icon="command" aria-hidden="true" focusable="false"></svg><span>命令面板</span></button>
      </section>
      <section role="group" aria-labelledby="settingsWorkspace"><h3 id="settingsWorkspace">工作区</h3>
        <button type="button" class="settings-destination" id="navPlanner" aria-label="任务" title="任务"><svg data-icon="task" aria-hidden="true" focusable="false"></svg><span>任务与审阅</span><span class="rail-badge" id="planCount"></span></button>
      </section>
      <section role="group" aria-labelledby="settingsAccounts"><h3 id="settingsAccounts">模型与账户</h3>
        <button type="button" id="navProviders"><svg data-icon="package" aria-hidden="true" focusable="false"></svg><span>模型供应商</span><span class="rp-count" id="providerCount"></span></button>
        <button type="button" id="navProviderAuth"><svg data-icon="key" aria-hidden="true" focusable="false"></svg><span>供应商与认证</span></button>
      </section>
      <section role="group" aria-labelledby="settingsCapabilities"><h3 id="settingsCapabilities">Agent 能力</h3>
        <button type="button" id="navCapabilities"><svg data-icon="chip" aria-hidden="true" focusable="false"></svg><span>能力状态</span></button>
      </section>
      <section role="group" aria-labelledby="settingsExtensions"><h3 id="settingsExtensions">扩展与 MCP</h3>
        <button type="button" class="settings-destination" id="navExtensions" aria-label="Skills 与扩展" title="Skills 与扩展"><svg data-icon="book" aria-hidden="true" focusable="false"></svg><span>Skills 与扩展</span><span class="rail-badge" id="extCount"></span></button>
        <button type="button" id="navMcp"><svg data-icon="layers" aria-hidden="true" focusable="false"></svg><span>MCP 配置</span></button>
      </section>
      <section role="group" aria-labelledby="settingsApp"><h3 id="settingsApp">应用与更新</h3>
        <button type="button" id="navAppUpdates"><svg data-icon="update" aria-hidden="true" focusable="false"></svg><span>Pi GUI 与 Pi 更新</span><span class="rp-dot" id="menuUpdateDot" hidden></span><span class="rp-dot" id="piUpdateDot" hidden></span></button>
        <button type="button" id="navRestartPi"><svg data-icon="refresh" aria-hidden="true" focusable="false"></svg><span>重启 Pi</span></button>
      </section>
      <section role="group" aria-labelledby="settingsDiagnostics"><h3 id="settingsDiagnostics">诊断</h3>
        <button type="button" id="navDiagnostics"><svg data-icon="activity" aria-hidden="true" focusable="false"></svg><span>运行状态与诊断</span></button>
        <button type="button" id="navLogs"><svg data-icon="fileText" aria-hidden="true" focusable="false"></svg><span>日志与故障报告…</span></button>
      </section>
    </nav>
    <div class="rail-spacer"></div>
    <details class="quota" id="usageDetails"><summary class="quota-head"><svg class="quota-ic" data-icon="context" aria-hidden="true" focusable="false"></svg><span>上下文</span><b id="uPct">—</b></summary><div class="quota-detail"><div class="bar"><span id="uCtxBar"></span></div><div class="quota-note" id="uNote">上下文 —</div><div class="quota-rows"><div><span>输入 / 输出</span><b id="uTok">—</b></div><div><span>缓存读取</span><b id="uCache">—</b></div><div><span>累计成本</span><b id="uCost">—</b></div><div><span>远端额度</span><b id="uQuota">—</b></div></div></div></details>
    <div class="sidebar-preferences"><button type="button" class="rail-icon nav-item" id="navGlobalMore" aria-label="设置" aria-controls="globalMoreMenu" aria-expanded="false" title="设置"><svg data-icon="settings" aria-hidden="true" focusable="false"></svg><span class="rp-dot" id="updateDot" hidden></span><span>设置</span></button><button type="button" class="icon-btn" id="btnTheme" aria-label="外观与主题" title="外观与主题"><svg data-icon="sun" aria-hidden="true" focusable="false"></svg></button>
    <footer class="rail-foot"><span class="avatar">π</span><span class="foot-name" id="footName">—</span><span class="grow"></span><span class="conn" id="conn"></span><span class="foot-state" id="connText">连接中</span></footer></div>
  </aside>


  <main class="stage" id="workspace">
    <header class="stage-head">

      <div class="conversation-heading">
        <span class="title-project-context" id="titleProjectContext" hidden><span class="title-project"><svg data-icon="folder" aria-hidden="true" focusable="false"></svg><span id="titleProject"></span></span><span class="title-separator" aria-hidden="true">/</span></span>
        <h1 id="title">新会话</h1>
      </div>
      <!-- P7：当前会话关联了哪些任务（没有关联时整块 hidden，不占位）。
           内容由 session-plans.js 填，只在真的命中时才显形。 -->
      <h1 id="workViewTitle" hidden></h1>
      <div class="sess-plans" id="sessionPlans" hidden></div>
      <div class="head-right">
        <div class="conversation-actions" role="group" aria-label="会话操作">
          <button type="button" class="icon-btn" id="btnTopbarNew" aria-label="新对话" title="新对话"><svg data-icon="conversation" aria-hidden="true" focusable="false"></svg></button>
          <button type="button" class="icon-btn" id="btnTopbarSearch" aria-label="搜索会话" title="搜索会话"><svg data-icon="search" aria-hidden="true" focusable="false"></svg></button>
        </div>
        <button type="button" class="icon-btn" id="btnWorkPanel" aria-label="工作面板" title="工作面板" aria-controls="rightPane" aria-expanded="false"><svg data-icon="panel" aria-hidden="true" focusable="false"></svg></button>
        <button type="button" class="icon-btn" id="btnMore" title="更多" aria-label="更多操作">
          <svg data-icon="more" aria-hidden="true" focusable="false"></svg>
        </button>
      </div>
    </header>

    <!-- P24：状态条。只在「有持续问题、且有可执行下一步」时显形
         （pi 启动失败 / 已退出 / 关键能力不可用）。正常状态与「没选项目」
         都不占用这里 —— 后者由下面的欢迎区负责。 -->
    <div class="stage-notice" id="stageNotice" role="status" hidden></div>

    <!-- 会话内导航（Conversation Minimap）放在正文左侧的独立列里，
         不叠在滚动条上 —— 叠上去会有点击冲突，而且窄窗口下会挤正文。 -->
    <div class="convo" id="chatView">
      <div class="stream" id="stream">
      <div class="welcome" id="welcome">
        <div class="welcome-pane" id="welcomeRestore" hidden>
          <h2>正在恢复工作区…</h2>
          <p>正在连接上次使用的项目。</p>
        </div>
        <!-- 两块引导一开始就都藏着，等 /api/status 回来再决定显哪一块
             （applyProjectState）。
             先显任何一块都会在另一半情况下「闪一下错的文案」——
             尤其不能先显「Pi 已就绪」，首次启动的用户会以为已经能用了。 -->
        <!-- 形态 A：已选项目，pi 就绪 -->
        <div class="welcome-pane" id="welcomeReady" hidden>
          <svg class="welcome-mark" viewBox="0 0 24 24"><path d="M4.5 8h15M9.5 8v11M15.5 8v8"/></svg>
          <h2>开始一个任务</h2>
          <p>在下方输入你想完成的事。</p>
        </div>

        <!-- 形态 B：还没选项目。
             这里刻意不猜一个默认目录（以前是用户主目录），而是明确让用户选一个 ——
             pi 会在那个目录里读写文件、执行命令，选错了是要出事的，
             不该由程序替用户决定。 -->
        <div class="welcome-pane" id="welcomeNoProj" hidden>
          <svg class="welcome-mark" data-icon="folder" aria-hidden="true" focusable="false"></svg>
          <h2>打开项目，开始工作</h2>
          <p>选择 Pi 将要读写和执行命令的项目文件夹。</p>
          <button type="button" class="welcome-cta" id="btnPickProject">
            <svg data-icon="plus" aria-hidden="true" focusable="false"></svg>
            <span>添加文件夹</span>
          </button>
        </div>
      </div>
      </div>
      <nav class="convo-nav" id="convoNav" aria-label="会话内提问导航"></nav>
    </div>

    <div class="composer" id="chatComposer">
      <div class="composer-box ds-composer-field" id="composerBox">
        <div class="attach-tray" id="attachTray" role="list" aria-label="待发送附件" hidden></div>
        <textarea id="input" rows="1" placeholder="描述任务，或输入 / 查看命令…" aria-label="输入消息"></textarea>
        <div class="composer-bar">
          <div class="cb-left">
            <button type="button" class="icon-btn" id="btnAttach" title="添加文件：图片 / PDF / Word / 文本" aria-label="添加文件">
              <svg data-icon="plus" aria-hidden="true" focusable="false"></svg>
            </button>
            <input type="file" id="fileInput" multiple hidden>
            <span class="status-text" id="statusText"></span>
          </div>
          <div class="cb-right">
            <button type="button" class="ctx-chip" id="btnCtx" title="上下文占用" aria-label="上下文占用" aria-controls="composerPopover" aria-expanded="false">
              <svg class="ctx-ring" viewBox="0 0 36 36" aria-hidden="true">
                <circle class="ring-bg" cx="18" cy="18" r="15.5"></circle>
                <circle class="ring-fg" id="ctxRing" cx="18" cy="18" r="15.5"></circle>
              </svg>
              <span id="ctxPct">—</span>
            </button>
            <button type="button" class="chip" id="btnModel" title="切换模型" aria-label="切换模型" aria-controls="composerPopover" aria-expanded="false">
              <span class="chip-dot"></span>
              <span id="modelText">模型</span>
            </button>
            <button type="button" class="chip" id="btnThink" title="思考强度" aria-label="切换思考强度" aria-controls="composerPopover" aria-expanded="false">
              <span id="thinkText">思考 —</span>
            </button>
            <button type="button" class="btn-stop" id="btnStop" title="停止" aria-label="停止" hidden>
              <svg data-icon="stop" aria-hidden="true" focusable="false"></svg>
              <span>停止</span>
            </button>
            <button type="button" class="mic-btn" id="btnSend" disabled title="发送" aria-label="发送消息">
              <svg data-icon="arrowUp" aria-hidden="true" focusable="false"></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <section class="work-surface" id="workSurface" aria-label="工作区" hidden></section>
    <!-- P32.4-B：中央的并行会话承载。由 runtime-conversation.js 挂载。 -->
    <section class="runtime-conversation-view" id="runtimeView" aria-label="并行会话" hidden></section>
  </main>

  <!-- 右栏工作区（P26）。第一版只装「内置浏览器」一面 —— 文件预览 / Markdown /
       localhost 预览以后复用同一个外壳，到时候不必再动聊天那边的任何代码。
       网页本身不是 DOM：主进程会把 WebContentsView 摆到 #browserViewport 的矩形上
       （见 electron/browser-view.cjs），所以这个占位块的内容是空的。 -->
  <aside class="right-pane" id="rightPane" aria-label="右侧工作区" hidden>
    <div class="rp-resizer" id="rightPaneResizer" role="separator" aria-orientation="vertical" aria-label="调整右栏宽度" tabindex="0"></div>
    <!-- The same 46px title band now contains the existing tools. CSS ends its
         drag box before native caption controls; the tool strip can scroll. -->
    <nav id="workPanelNav" class="rp-titlebar work-panel-nav" aria-label="工作面板工具">
      <div class="work-panel-tool-strip">
      <button type="button" class="icon-btn" id="btnTree" title="分支树" aria-label="分支树">
        <svg data-icon="branch" aria-hidden="true" focusable="false"></svg><span class="work-tool-label">分支树</span>
        <span id="branchCount" class="head-count"></span>
      </button>
        <button type="button" class="icon-btn" id="navChanges" aria-label="文件变更" title="文件变更" aria-pressed="false"><svg data-icon="changes" aria-hidden="true" focusable="false"></svg><span class="work-tool-label">文件变更</span><span class="head-count" id="changesCount" hidden></span></button>
        <button type="button" class="icon-btn" id="btnTerminal" title="终端" aria-label="终端" aria-pressed="false">
          <svg data-icon="terminal" aria-hidden="true" focusable="false"></svg><span class="work-tool-label">终端</span>
        </button>
        <button type="button" class="icon-btn" id="btnFiles" title="文件" aria-label="文件" aria-pressed="false">
          <svg data-icon="folder" aria-hidden="true" focusable="false"></svg><span class="work-tool-label">文件</span>
        </button>
        <button type="button" class="icon-btn" id="btnSpecs" title="项目 Specs" aria-label="项目 Specs" aria-pressed="false">
          <svg data-icon="fileText" aria-hidden="true" focusable="false"></svg><span class="work-tool-label">Specs</span>
        </button>
        <button type="button" class="icon-btn" id="btnCollab" title="协同文档" aria-label="协同文档" aria-pressed="false">
          <svg data-icon="diagram" aria-hidden="true" focusable="false"></svg><span class="work-tool-label">协同文档</span>
        </button>
        <button type="button" class="icon-btn" id="btnBrowser" title="内置浏览器" aria-label="内置浏览器" aria-pressed="false">
          <svg data-icon="globe" aria-hidden="true" focusable="false"></svg><span class="work-tool-label">浏览器</span>
        </button>
      </div>
      <button type="button" class="icon-btn" id="workPanelHome" aria-label="选择工作面板工具" title="选择工作面板工具" hidden><svg data-icon="plus" aria-hidden="true" focusable="false"></svg></button>
      <button type="button" class="icon-btn" id="workPanelClose" aria-label="关闭工作面板" title="关闭工作面板"><svg data-icon="close" aria-hidden="true" focusable="false"></svg></button>
    </nav>
    <div class="rp-body"></div>
  </aside>

</div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" id="modalCard"></div>
</div>

<!-- 二次确认层。
     刻意**不复用** #modal：确认往往发生在另一个弹层之上（最典型的是「文件变更」
     面板里点撤销），而复用同一个容器会把下层面板一起清空 —— 用户确认完，
     面板和里面的 diff 全没了。单独一层就没有这个问题，层级关系也更好读：
     确认永远在最上面。 -->
<div class="modal confirm" id="confirmLayer" hidden>
  <div class="modal-card" id="confirmCard"></div>
</div>

<!-- 命令面板层（P24）。
     同样**不复用** #modal：面板可能在任何一个视图里被叫出来，也可能在关掉之后
     立刻打开一个真正的弹层（例如「打开诊断」）。共用一层会让「先关面板再开弹层」
     变成「弹层被自己清掉」。它只做一件事：一个输入框 + 一个命令列表。 -->
<div class="modal palette-layer" id="paletteLayer" hidden></div>

<div class="toasts" id="toasts"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
