<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pi GUI</title>
<script src="/theme-init.js"></script>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/ui/primitives.css">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/app-shell.css">
<link rel="stylesheet" href="/runtime-conversation.css">
<link rel="stylesheet" href="/ui3-composer.css">
<link rel="stylesheet" href="/ui3-model.css">
<link id="ui3-inline-commands-style" data-ui3-inline-commands rel="stylesheet" href="/ui3-inline-commands.css">
<link rel="stylesheet" href="/process.css">
<link id="ui4-pane-style" rel="stylesheet" href="/ui4-pane.css">
<link id="specs-style" rel="stylesheet" href="/specs.css">
<link id="ui4-approval-style" data-ui4-approval rel="stylesheet" href="/ui4-approval.css">
<link id="ui4-feedback-style" data-ui4-feedback rel="stylesheet" href="/ui4-feedback.css">
<link id="ui5-logs-style" data-ui5-logs rel="stylesheet" href="/ui5-logs.css">
<link id="viz-style" rel="stylesheet" href="/viz.css">
<link rel="stylesheet" href="/collab.css">
<link rel="stylesheet" href="/collab-panel.css">
<link rel="stylesheet" href="/collab-productivity.css">
</head>
<body>

<div class="app">

  <nav class="global-rail" id="globalRail" aria-label="折叠的侧栏" hidden>
    <button type="button" class="rail-icon" id="btnSidebarExpand" aria-label="展开项目侧栏" aria-controls="projectSidebar" aria-expanded="true" title="展开项目侧栏"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM10 5v14M13 12h5m-2-2 2 2-2 2"/></svg></button>
  </nav>

  <aside class="rail project-sidebar" id="projectSidebar" aria-label="项目与会话">
    <header class="rail-head">
      <div class="brand"><span class="brand-mark">π</span><span>pi-GUI</span></div>
      <button type="button" class="icon-btn" id="btnSidebarCollapse" aria-label="折叠项目侧栏" aria-controls="projectSidebar" aria-expanded="true" title="折叠项目侧栏"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM10 5v14M17 12h-5m2-2-2 2 2 2"/></svg></button>
    </header>
    <button type="button" class="settings-return nav-item" id="settingsReturn" hidden><svg viewBox="0 0 24 24" class="return-ic"><path d="M15 18l-6-6 6-6"/></svg><span>返回应用</span></button>
    <nav class="rail-nav" aria-label="会话操作">
      <div class="sidebar-session-heading">
        <button type="button" class="nav-item rail-icon is-active" id="navHome" aria-label="对话" aria-current="page" title="对话"><span class="ni-label">会话</span></button>
        <button type="button" class="icon-btn" id="navSearch" aria-label="搜索会话" title="搜索会话" aria-controls="groupBody" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></svg></button>
      </div>
      <button type="button" class="nav-item" id="navNew"><svg class="ni-ic" viewBox="0 0 24 24"><path d="M20 12.5a2.5 2.5 0 0 1-2.5 2.5H8l-4 3.5V5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5z"/></svg><span class="ni-label">新对话</span><span aria-hidden="true">＋</span></button>
    </nav>
    <div class="rail-group open">
      <div class="group-bar"><button type="button" class="group-head" id="groupHead" aria-controls="groupBody" aria-expanded="true"><span>项目</span><svg class="chev" viewBox="0 0 24 24"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg></button><button type="button" class="icon-btn project-actions-toggle" id="btnProjectMenu" aria-label="项目操作" aria-controls="projectActions" aria-expanded="false" title="项目操作">···</button></div>
      <div class="project-actions" id="projectActions" hidden>
        <button type="button" class="group-add" id="btnAddProject">添加文件夹</button>
        <button type="button" class="group-add" id="btnProjectSettings">项目设置</button>
      </div>
      <div class="group-body" id="groupBody"><div class="projects" id="projects"><div class="hint-empty">加载中…</div></div></div>
    </div>
    <nav class="global-more-menu settings-menu" id="globalMoreMenu" hidden aria-label="设置">
      <div class="settings-search-bar" id="settingsSearchBar">
        <svg viewBox="0 0 24 24" class="search-ic"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></svg>
        <input type="text" class="settings-search-input" id="settingsSearchInput" placeholder="搜索设置..." aria-label="搜索设置">
      </div>
      <section role="group" aria-labelledby="settingsAppearance"><h3 id="settingsAppearance">常规与界面</h3>
        <button type="button" id="navAppearance"><svg viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg><span>常规</span></button>
        <button type="button" id="navShortcutHelp" title="查看键盘快捷键"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h.01M11 9h.01M15 9h.01M7 13h.01M11 13h.01M15 13h.01M7 16h10"/></svg><span>快捷键</span></button>
        <button type="button" id="navPalette" title="打开命令面板"><svg viewBox="0 0 24 24"><polyline points="4 17 10 12 4 7"/><line x1="12" y1="19" x2="20" y2="19"/></svg><span>命令面板</span></button>
      </section>
      <section role="group" aria-labelledby="settingsWorkspace"><h3 id="settingsWorkspace">工作区</h3>
        <button type="button" class="settings-destination" id="navPlanner" aria-label="任务" title="任务"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span>任务与审阅</span><span class="rail-badge" id="planCount"></span></button>
      </section>
      <section role="group" aria-labelledby="settingsAccounts"><h3 id="settingsAccounts">模型与账户</h3>
        <button type="button" id="navProviders"><svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg><span>模型供应商</span><span class="rp-count" id="providerCount"></span></button>
        <button type="button" id="navProviderAuth"><svg viewBox="0 0 24 24"><path d="M21 2l-2 2m-1.5 1.5L14 9l-3 3-2-2-4 4 3 3 7-7 1.5-1.5M16 8l2 2"/></svg><span>供应商与认证</span></button>
      </section>
      <section role="group" aria-labelledby="settingsCapabilities"><h3 id="settingsCapabilities">Agent 能力</h3>
        <button type="button" id="navCapabilities"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></svg><span>能力状态</span></button>
      </section>
      <section role="group" aria-labelledby="settingsExtensions"><h3 id="settingsExtensions">扩展与 MCP</h3>
        <button type="button" class="settings-destination" id="navExtensions" aria-label="Skills 与扩展" title="Skills 与扩展"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"/></svg><span>Skills 与扩展</span><span class="rail-badge" id="extCount"></span></button>
        <button type="button" id="navMcp"><svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg><span>MCP 配置</span></button>
      </section>
      <section role="group" aria-labelledby="settingsApp"><h3 id="settingsApp">应用与更新</h3>
        <button type="button" id="navAppUpdates"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m16 12-4-4-4 4M12 16V8"/></svg><span>Pi GUI 与 Pi 更新</span><span class="rp-dot" id="menuUpdateDot" hidden></span><span class="rp-dot" id="piUpdateDot" hidden></span></button>
        <button type="button" id="navRestartPi"><svg viewBox="0 0 24 24"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg><span>重启 Pi</span></button>
      </section>
      <section role="group" aria-labelledby="settingsDiagnostics"><h3 id="settingsDiagnostics">诊断</h3>
        <button type="button" id="navDiagnostics"><svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><span>运行状态与诊断</span></button>
        <button type="button" id="navLogs"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg><span>日志与故障报告…</span></button>
      </section>
    </nav>
    <div class="rail-spacer"></div>
    <details class="quota" id="usageDetails"><summary class="quota-head"><svg class="quota-ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 12l4.5-4.5"/></svg><span>上下文</span><b id="uPct">—</b></summary><div class="quota-detail"><div class="bar"><span id="uCtxBar"></span></div><div class="quota-note" id="uNote">上下文 —</div><div class="quota-rows"><div><span>输入 / 输出</span><b id="uTok">—</b></div><div><span>缓存读取</span><b id="uCache">—</b></div><div><span>累计成本</span><b id="uCost">—</b></div><div><span>远端额度</span><b id="uQuota">—</b></div></div></div></details>
    <div class="sidebar-preferences"><button type="button" class="rail-icon nav-item" id="navGlobalMore" aria-label="设置" aria-controls="globalMoreMenu" aria-expanded="false" title="设置"><svg viewBox="0 0 24 24"><path d="M9 4h6l1 3 3 1v6l-3 1-1 3H9l-1-3-3-1V8l3-1z"/><circle cx="12" cy="11" r="3"/></svg><span class="rp-dot" id="updateDot" hidden></span><span>设置</span></button><button type="button" class="icon-btn" id="btnTheme" aria-label="外观与主题" title="外观与主题"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg></button>
    <footer class="rail-foot"><span class="avatar">π</span><span class="foot-name" id="footName">—</span><span class="grow"></span><span class="conn" id="conn"></span><span class="foot-state" id="connText">连接中</span></footer></div>
  </aside>


  <main class="stage" id="workspace">
    <header class="stage-head">

      <div class="conversation-heading">
        <span class="title-project-context" id="titleProjectContext" hidden><span class="title-project"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span id="titleProject"></span></span><span class="title-separator" aria-hidden="true">/</span></span>
        <h1 id="title">新会话</h1>
      </div>
      <!-- P7：当前会话关联了哪些任务（没有关联时整块 hidden，不占位）。
           内容由 session-plans.js 填，只在真的命中时才显形。 -->
      <h1 id="workViewTitle" hidden></h1>
      <div class="sess-plans" id="sessionPlans" hidden></div>
      <div class="head-right">
        <div class="conversation-actions" role="group" aria-label="会话操作">
          <button type="button" class="icon-btn" id="btnTopbarNew" aria-label="新对话" title="新对话"><svg viewBox="0 0 24 24"><path d="M20 12.5a2.5 2.5 0 0 1-2.5 2.5H8l-4 3.5V5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5zM12 6v6M9 9h6"/></svg></button>
          <button type="button" class="icon-btn" id="btnTopbarSearch" aria-label="搜索会话" title="搜索会话"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></svg></button>
        </div>
        <button type="button" class="icon-btn" id="btnWorkPanel" aria-label="工作面板" title="工作面板" aria-controls="rightPane" aria-expanded="false"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><path d="M14 5v14"/></svg></button>
        <button type="button" class="icon-btn" id="btnMore" title="更多" aria-label="更多操作">
          <svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg>
        </button>
      </div>
    </header>

    <!-- P24：状态条。只在「有持续问题、且有可执行下一步」时显形
         （pi 启动失败 / 已退出 / 关键能力不可用）。正常状态与「没选项目」
         都不占用这里 —— 后者由下面的欢迎区负责。 -->
    <div class="stage-notice" id="stageNotice" role="status" hidden></div>

    <!-- 会话内导航（Conversation Minimap）放在正文左侧的独立列里，
         不叠在滚动条上 —— 叠上去会有点击冲突，而且窄窗口下会挤正文。 -->
    <div class="convo" id="chatView">
      <div class="stream" id="stream">
      <div class="welcome" id="welcome">
        <div class="welcome-pane" id="welcomeRestore" hidden>
          <h2>正在恢复工作区…</h2>
          <p>正在连接上次使用的项目。</p>
        </div>
        <!-- 两块引导一开始就都藏着，等 /api/status 回来再决定显哪一块
             （applyProjectState）。
             先显任何一块都会在另一半情况下「闪一下错的文案」——
             尤其不能先显「Pi 已就绪」，首次启动的用户会以为已经能用了。 -->
        <!-- 形态 A：已选项目，pi 就绪 -->
        <div class="welcome-pane" id="welcomeReady" hidden>
          <svg class="welcome-mark" viewBox="0 0 24 24"><path d="M4.5 8h15M9.5 8v11M15.5 8v8"/></svg>
          <h2>开始一个任务</h2>
          <p>在下方输入你想完成的事。</p>
        </div>

        <!-- 形态 B：还没选项目。
             这里刻意不猜一个默认目录（以前是用户主目录），而是明确让用户选一个 ——
             pi 会在那个目录里读写文件、执行命令，选错了是要出事的，
             不该由程序替用户决定。 -->
        <div class="welcome-pane" id="welcomeNoProj" hidden>
          <svg class="welcome-mark" viewBox="0 0 24 24">
            <path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h3.2l1.6 2h8.2a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>
          </svg>
          <h2>打开项目，开始工作</h2>
          <p>选择 Pi 将要读写和执行命令的项目文件夹。</p>
          <button type="button" class="welcome-cta" id="btnPickProject">
            <svg viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></svg>
            <span>添加文件夹</span>
          </button>
        </div>
      </div>
      </div>
      <nav class="convo-nav" id="convoNav" aria-label="会话内提问导航"></nav>
    </div>

    <div class="composer" id="chatComposer">
      <div class="composer-box" id="composerBox">
        <div class="attach-tray" id="attachTray" role="list" aria-label="待发送附件" hidden></div>
        <textarea id="input" rows="1" placeholder="描述任务，或输入 / 查看命令…" aria-label="输入消息"></textarea>
        <div class="composer-bar">
          <div class="cb-left">
            <button type="button" class="icon-btn" id="btnAttach" title="添加文件：图片 / PDF / Word / 文本" aria-label="添加文件">
              <svg viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></svg>
            </button>
            <input type="file" id="fileInput" multiple hidden>
            <span class="status-text" id="statusText"></span>
          </div>
          <div class="cb-right">
            <button type="button" class="ctx-chip" id="btnCtx" title="上下文占用" aria-label="上下文占用" aria-controls="composerPopover" aria-expanded="false">
              <svg class="ctx-ring" viewBox="0 0 36 36" aria-hidden="true">
                <circle class="ring-bg" cx="18" cy="18" r="15.5"></circle>
                <circle class="ring-fg" id="ctxRing" cx="18" cy="18" r="15.5"></circle>
              </svg>
              <span id="ctxPct">—</span>
            </button>
            <button type="button" class="chip" id="btnModel" title="切换模型" aria-label="切换模型" aria-controls="composerPopover" aria-expanded="false">
              <span class="chip-dot"></span>
              <span id="modelText">模型</span>
            </button>
            <button type="button" class="chip" id="btnThink" title="思考强度" aria-label="切换思考强度" aria-controls="composerPopover" aria-expanded="false">
              <span id="thinkText">思考 —</span>
            </button>
            <button type="button" class="btn-stop" id="btnStop" title="停止" aria-label="停止" hidden>
              <svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
              <span>停止</span>
            </button>
            <button type="button" class="mic-btn" id="btnSend" disabled title="发送" aria-label="发送消息">
              <svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <section class="work-surface" id="workSurface" aria-label="工作区" hidden></section>
    <!-- P32.4-B：中央的并行会话承载。由 runtime-conversation.js 挂载。 -->
    <section class="runtime-conversation-view" id="runtimeView" aria-label="并行会话" hidden></section>
  </main>

  <!-- 右栏工作区（P26）。第一版只装「内置浏览器」一面 —— 文件预览 / Markdown /
       localhost 预览以后复用同一个外壳，到时候不必再动聊天那边的任何代码。
       网页本身不是 DOM：主进程会把 WebContentsView 摆到 #browserViewport 的矩形上
       （见 electron/browser-view.cjs），所以这个占位块的内容是空的。 -->
  <aside class="right-pane" id="rightPane" aria-label="右侧工作区" hidden>
    <div class="rp-resizer" id="rightPaneResizer" role="separator" aria-orientation="vertical" aria-label="调整右栏宽度" tabindex="0"></div>
    <!-- 顶部 46px 空档：这一条正好落在原生窗口按钮（最小化/最大化/关闭）下面。
         主进程用了 titleBarStyle:'hidden'，那三个按钮是**系统画的**，页面上任何
         控件放在那一带都会被它们盖住点不到 —— 所以这里留空并声明成拖拽区，
         把浏览器工具栏放到下面一行（与 .stage-head 同一高度，视觉上对齐）。 -->
    <div class="rp-titlebar" aria-hidden="true"></div>
    <nav id="workPanelNav" class="work-panel-nav" aria-label="工作面板工具">
      <button type="button" class="icon-btn" id="btnTree" title="分支树" aria-label="分支树">
        <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="12" r="2.5"/><path d="M6 8.5v7"/><path d="M8.5 6h4a3 3 0 0 1 3 3v.5"/></svg><span class="work-tool-label">分支树</span>
        <span id="branchCount" class="head-count"></span>
      </button>
        <button type="button" class="icon-btn" id="navChanges" aria-label="文件变更" title="文件变更" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M7 4.5h10a2 2 0 0 1 2 2v13l-3-2-3 2-3-2-3 2v-13a2 2 0 0 1 2-2z"/><path d="M10 9.5h4M10 13h4"/></svg><span class="work-tool-label">文件变更</span><span class="head-count" id="changesCount" hidden></span></button>
        <button type="button" class="icon-btn" id="btnSpecs" title="项目 Specs" aria-label="项目 Specs" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M6 4.5h9l3 3v12H6z"/><path d="M15 4.5v3h3M9 11h6M9 14h6M9 17h4"/></svg><span class="work-tool-label">Specs</span>
        </button>
        <button type="button" class="icon-btn" id="btnCollab" title="协同文档" aria-label="协同文档" aria-pressed="false">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="5" rx="1"/><rect x="14" y="16" width="7" height="5" rx="1"/><path d="M6.5 8v10.5H14M11 15.5l3 3-3 3"/></svg><span class="work-tool-label">协同文档</span>
        </button>
        <button type="button" class="icon-btn" id="btnBrowser" title="内置浏览器" aria-label="内置浏览器" aria-pressed="false">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.6 9.5h16.8M3.6 14.5h16.8"/><path d="M12 3.5c2.2 2.4 3.3 5.3 3.3 8.5s-1.1 6.1-3.3 8.5c-2.2-2.4-3.3-5.3-3.3-8.5S9.8 5.9 12 3.5z"/></svg><span class="work-tool-label">浏览器</span>
        </button>
<button type="button" class="icon-btn" id="workPanelClose" aria-label="关闭工作面板" title="关闭工作面板">×</button>
    </nav>
    <div class="rp-body"></div>
  </aside>

</div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" id="modalCard"></div>
</div>

<!-- 二次确认层。
     刻意**不复用** #modal：确认往往发生在另一个弹层之上（最典型的是「文件变更」
     面板里点撤销），而复用同一个容器会把下层面板一起清空 —— 用户确认完，
     面板和里面的 diff 全没了。单独一层就没有这个问题，层级关系也更好读：
     确认永远在最上面。 -->
<div class="modal confirm" id="confirmLayer" hidden>
  <div class="modal-card" id="confirmCard"></div>
</div>

<!-- 命令面板层（P24）。
     同样**不复用** #modal：面板可能在任何一个视图里被叫出来，也可能在关掉之后
     立刻打开一个真正的弹层（例如「打开诊断」）。共用一层会让「先关面板再开弹层」
     变成「弹层被自己清掉」。它只做一件事：一个输入框 + 一个命令列表。 -->
<div class="modal palette-layer" id="paletteLayer" hidden></div>

<div class="toasts" id="toasts"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
